{{- if and .Values.minio.enabled .Values.externalSecrets.enabled }}
# MinIO's root credentials. Separate from the relay's Secret because they are a
# different trust level: root can create users and delete buckets, the relay's
# credentials cannot.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "buzz-gke.minio.fullname" . }}-root
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buzz-gke.minio.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.clusterSecretStoreName }}
  target:
    name: {{ include "buzz-gke.minio.fullname" . }}-root
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: MINIO_ROOT_USER
      remoteRef:
        key: {{ printf "%s-minio-root-user" .Values.gcp.namePrefix }}
        version: latest
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: {{ printf "%s-minio-root-password" .Values.gcp.namePrefix }}
        version: latest
{{- end }}
