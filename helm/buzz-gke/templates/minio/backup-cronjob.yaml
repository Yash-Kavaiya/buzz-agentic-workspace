{{- include "buzz-gke.validate" . -}}
{{- if and .Values.minio.enabled .Values.minio.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.minio.backup.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buzz-gke.minio.labels" . | nindent 4 }}
  annotations:
    # Workload Identity: the job writes to the DR bucket as a GSA that has
    # objectUser (write, no delete) and nothing else in the project.
    iam.gke.io/gcp-service-account: {{ .Values.gcp.workloadIdentity.minioBackupServiceAccount | quote }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "buzz-gke.minio.fullname" . }}-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buzz-gke.minio.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.minio.backup.schedule | quote }}
  # A backup that overlaps itself doubles read load on the live store for no
  # benefit; skip rather than pile up.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: {{ .Values.minio.backup.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "buzz-gke.minio.selectorLabels" . | nindent 12 }}
            buzz.io/job: minio-backup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ .Values.minio.backup.serviceAccountName }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mirror
              image: {{ .Values.minio.mcImage | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              env:
                - name: MINIO_ENDPOINT
                  value: {{ include "buzz-gke.minio.endpoint" . | quote }}
                - name: BUCKET
                  value: {{ .Values.minio.bucket | quote }}
                - name: DR_BUCKET
                  value: {{ .Values.gcp.backup.drBucket | quote }}
                - name: BUZZ_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.externalSecrets.targetSecretName }}
                      key: BUZZ_S3_ACCESS_KEY
                - name: BUZZ_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.externalSecrets.targetSecretName }}
                      key: BUZZ_S3_SECRET_KEY
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  # The DR copy is a RESTORE SOURCE, not a runnable backend.
                  # Buzz cannot serve from GCS: its git manifest pointer needs
                  # S3 ETag conditional writes, which the GCS S3-compat API
                  # supports on reads only. Restoring means restoring into
                  # MinIO. See docs/40-backup-dr.md.
                  if [ -z "$DR_BUCKET" ]; then
                    echo "no DR bucket configured; nothing to do" >&2
                    exit 0
                  fi

                  # HMAC keys for the GCS S3-compat endpoint are provisioned by
                  # `buzzctl backup enable` and mounted from this Secret.
                  if [ ! -f /gcs/access_key ] || [ ! -f /gcs/secret_key ]; then
                    echo "GCS interoperability credentials not mounted." >&2
                    echo "Run: buzzctl backup enable <env>" >&2
                    exit 1
                  fi

                  mc alias set src "$MINIO_ENDPOINT" "$BUZZ_S3_ACCESS_KEY" "$BUZZ_S3_SECRET_KEY"
                  mc alias set dst https://storage.googleapis.com \
                    "$(cat /gcs/access_key)" "$(cat /gcs/secret_key)"

                  echo "mirroring $BUCKET -> $DR_BUCKET"
                  # No --remove: the DR bucket must not lose an object because
                  # the live store lost it. Deletions there are governed by the
                  # bucket's own lifecycle and retention policy instead.
                  mc mirror --overwrite --preserve "src/$BUCKET" "dst/$DR_BUCKET"

                  # A marker object gives `buzzctl backup verify` something
                  # cheap and unambiguous to check for freshness.
                  date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/last-backup
                  mc cp /tmp/last-backup "dst/$DR_BUCKET/_buzz/last-backup"

                  echo "mirror complete"
              volumeMounts:
                - name: gcs-credentials
                  mountPath: /gcs
                  readOnly: true
              resources:
                requests:
                  cpu: 200m
                  memory: 256Mi
                limits:
                  cpu: "2"
                  memory: 1Gi
          volumes:
            - name: gcs-credentials
              secret:
                secretName: {{ include "buzz-gke.minio.fullname" . }}-gcs-hmac
                optional: true
{{- end }}
