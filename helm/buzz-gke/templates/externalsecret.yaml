{{- include "buzz-gke.validate" . -}}
{{- if .Values.externalSecrets.enabled }}
{{- if .Values.externalSecrets.createClusterSecretStore }}
# Cluster-scoped store so a single ESO installation can serve every Buzz
# namespace. Authentication is Workload Identity: no service-account key exists
# anywhere in this system.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.externalSecrets.clusterSecretStoreName }}
  labels:
    {{- include "buzz-gke.labels" . | nindent 4 }}
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.gcp.projectId | quote }}
      auth:
        workloadIdentity:
          clusterLocation: {{ .Values.gcp.region | quote }}
          clusterName: {{ .Values.gcp.namePrefix | quote }}
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccountName }}
            namespace: {{ .Values.externalSecrets.serviceAccountNamespace }}
---
{{- end }}
# The one Secret the relay reads. Key names here are exactly the environment
# variables the upstream chart mounts (see its examples/secret-sample.yaml);
# renaming one silently drops it, because upstream marks every key optional.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.targetSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buzz-gke.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.clusterSecretStoreName }}
  target:
    name: {{ .Values.externalSecrets.targetSecretName }}
    creationPolicy: Owner
    # Retain, not Delete: if the ExternalSecret or the store is removed the
    # relay keeps the credentials it already has rather than losing its
    # database and object-store access mid-flight.
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    {{- range $envVar, $suffix := .Values.externalSecrets.keys }}
    - secretKey: {{ $envVar }}
      remoteRef:
        key: {{ printf "%s-%s" $.Values.gcp.namePrefix $suffix }}
        version: latest
    {{- end }}
    # Optional keys are listed separately so a secret with no version yet does
    # not fail the whole ExternalSecret and take the relay's credentials with it.
    {{- range $envVar, $suffix := .Values.externalSecrets.optionalKeys }}
    - secretKey: {{ $envVar }}
      remoteRef:
        key: {{ printf "%s-%s" $.Values.gcp.namePrefix $suffix }}
        version: latest
        # ESO omits the key rather than erroring when the secret has no version.
        conversionStrategy: Default
        decodingStrategy: None
    {{- end }}
{{- end }}
