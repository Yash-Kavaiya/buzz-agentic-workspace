{{- include "buzz-gke.validate" . -}}
{{- if and .Values.gateway.enabled .Values.gateway.admin.enabled .Values.buzz.enabled }}
# The admin console, on its own hostname and its own Service, behind IAP.
#
# GKE applies a GCPBackendPolicy per Service. IAP must never reach the relay's
# backend, because Nostr clients carry no Google session and would all be
# refused. This Service selects the same relay pods so the console gets a
# separate load-balancer backend with its own policy.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "buzz-gke.adminServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buzz-gke.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: buzz
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: relay
  ports:
    - name: app
      port: {{ include "buzz-gke.relayPort" . }}
      targetPort: app
      protocol: TCP
    - name: health
      port: {{ include "buzz-gke.healthPort" . }}
      targetPort: health
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "buzz-gke.adminServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buzz-gke.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: https
  hostnames:
    - {{ .Values.gcp.edge.adminHostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "buzz-gke.adminServiceName" . }}
          port: {{ include "buzz-gke.relayPort" . }}
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ include "buzz-gke.adminServiceName" . }}-hc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buzz-gke.labels" . | nindent 4 }}
spec:
  default:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    logConfig:
      enabled: true
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_FIXED_PORT
        port: {{ include "buzz-gke.healthPort" . }}
        requestPath: /_readiness
  targetRef:
    group: ""
    kind: Service
    name: {{ include "buzz-gke.adminServiceName" . }}
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: {{ include "buzz-gke.adminServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buzz-gke.labels" . | nindent 4 }}
spec:
  default:
    {{- if .Values.gcp.edge.securityPolicyName }}
    securityPolicy: {{ .Values.gcp.edge.securityPolicyName | quote }}
    {{- end }}
    {{- if .Values.gateway.iap.enabled }}
    iap:
      enabled: true
      # Secret holding client_id and client_secret for the IAP OAuth client.
      # Created out of band; buzzctl does not mint OAuth clients.
      oauth2ClientSecret:
        name: {{ .Values.gateway.iap.oauthSecretName }}
    timeoutSec: 300
    {{- else }}
    timeoutSec: {{ .Values.gateway.backendTimeoutSeconds }}
    {{- end }}
    logging:
      enabled: true
      sampleRate: 500000
  targetRef:
    group: ""
    kind: Service
    name: {{ include "buzz-gke.adminServiceName" . }}
{{- end }}
