{{- include "buzz-gke.validate" . -}}
{{- if .Values.gateway.enabled }}
# Global external Gateway. Terraform owns the IP and the certificate map; this
# resource only binds them to the cluster's routing.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buzz-gke.labels" . | nindent 4 }}
  annotations:
    # Reserved anycast address, so DNS never has to chase a new IP.
    networking.gke.io/addresses: {{ .Values.gcp.edge.gatewayIpName | quote }}
    # Google-managed certificates from Certificate Manager. Renewal depends on
    # the DNS authorization records staying in the zone.
    networking.gke.io/certmap: {{ .Values.gcp.edge.certificateMapName | quote }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      # TLS is terminated with the certificate map above; no certificateRefs.
      allowedRoutes:
        namespaces:
          from: Same
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
# Plain HTTP exists only to redirect. A WebSocket client that reaches port 80
# should be told to come back over TLS, not served.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "buzz-gke.fullname" . }}-https-redirect
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buzz-gke.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: http
  hostnames:
    - {{ .Values.gcp.edge.relayHostname | quote }}
    {{- if .Values.gateway.admin.enabled }}
    - {{ .Values.gcp.edge.adminHostname | quote }}
    {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
